<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeloraGames</title><style>
:root{--p:#6d5dfc;--p2:#9b8cff;--bg:#f7f6ff;--text:#171522;--muted:#77738b;--line:#e9e7f2;--ok:#12a56b;--bad:#e14d60;--blue:#5c7cfa;--glass:#ffffffd9}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Arial,sans-serif;background:linear-gradient(180deg,#fbfaff 0%,#f6f4ff 100%);color:var(--text);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{border:0;border-radius:14px;padding:11px 14px;background:linear-gradient(135deg,var(--p),var(--p2));color:white;font-weight:800;box-shadow:0 8px 20px #6d5dfc25;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}button:hover{transform:translateY(-1px);box-shadow:0 11px 24px #6d5dfc32;filter:saturate(1.04)}button:active{transform:scale(.97)}button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}.hidden{display:none!important}.wrap{max-width:1150px;margin:auto;padding:18px}.card{background:var(--glass);border:1px solid #ffffffc7;border-radius:22px;padding:18px;box-shadow:0 14px 38px #5145a414;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden;background:radial-gradient(circle at 15% 15%,#ded8ff 0,transparent 30%),radial-gradient(circle at 85% 80%,#eeeaff 0,transparent 34%),linear-gradient(180deg,#fff 0%,#f5f2ff 100%)}.auth:before,.auth:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#8d7cff55,#c5bcff22);filter:blur(1px);animation:floatBlob 7s ease-in-out infinite;pointer-events:none}.auth:before{top:7%;left:-65px}.auth:after{right:-65px;bottom:6%;animation-delay:-3.5s}.authbox{width:min(440px,100%);position:relative;z-index:1;animation:loginPop .55s cubic-bezier(.2,.8,.2,1) both}.authbox h1{letter-spacing:-.7px;background:linear-gradient(90deg,#5747e8,#8d7cff);-webkit-background-clip:text;background-clip:text;color:transparent}.authbox h2{letter-spacing:-.4px}.authbox.login-pop{animation:loginPop .55s cubic-bezier(.2,.8,.2,1) both}.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;border-radius:15px;background:linear-gradient(145deg,#5b43e8 0%,#7b68f6 48%,#b4a9ff 100%);display:grid;place-items:center;color:#fff;font-size:23px;font-weight:950;position:relative;overflow:hidden;box-shadow:0 10px 25px #6d5dfc38,inset 0 1px 0 #ffffff80;transform:translateZ(0)}.logo:before{content:'';position:absolute;inset:-35%;background:linear-gradient(115deg,transparent 35%,#ffffff55 48%,transparent 61%);transform:translateX(-65%) rotate(10deg);animation:logoShine 4.8s ease-in-out infinite}.logo span{position:relative;z-index:1;text-shadow:0 2px 8px #34228a55;letter-spacing:-2px}.vbrand{display:flex;align-items:center;gap:12px}.vbrandtext{display:flex;flex-direction:column;line-height:1.05}.vbrandtext b{font-size:17px;letter-spacing:-.4px}.vbrandtext small{font-size:10px;color:var(--muted);font-weight:700;margin-top:4px}.auth-logo{width:78px;height:78px;border-radius:25px;font-size:40px;margin:0 auto 15px;box-shadow:0 18px 40px #6d5dfc35,inset 0 1px 0 #ffffffa8;animation:logoFloat 4s ease-in-out infinite}.auth-brand{text-align:center;margin-bottom:18px}.auth-brand h1{margin:0;font-size:27px}.auth-brand .muted{margin-top:6px}.verified-logo{width:21px;height:21px;border-radius:7px;background:linear-gradient(145deg,#5b43e8,#a99cff);font-size:11px;box-shadow:0 4px 12px #7254ff38}@keyframes logoShine{0%,55%,100%{transform:translateX(-75%) rotate(10deg)}72%{transform:translateX(75%) rotate(10deg)}}@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(-1deg)}}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#ffffffdc;outline:0;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}.field input:focus,.field textarea:focus,.field select:focus{border-color:#9b8cff;box-shadow:0 0 0 4px #8d7cff18;transform:translateY(-1px)}.muted{color:var(--muted);font-size:13px}.top{position:sticky;top:0;background:#ffffffd9;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20;border-bottom:1px solid #e9e7f2}.topin{max-width:1150px;margin:auto;padding:11px 18px;display:flex;justify-content:space-between;align-items:center}.nav{max-width:1150px;margin:auto;padding:8px 18px;display:flex;gap:7px;overflow:auto}.nav button{background:white;color:#555;border:1px solid var(--line);white-space:nowrap}.nav button.active{background:linear-gradient(135deg,var(--p),var(--p2));color:white;box-shadow:0 7px 18px #6d5dfc25}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#f0edff;color:#6245e7;font-size:12px;font-weight:800}.price{font-size:21px;font-weight:900;margin:7px 0}.product img{width:100%;height:190px;object-fit:cover;border-radius:14px;background:#f0eef8}.gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;border-radius:15px;scrollbar-width:none}.gallery::-webkit-scrollbar{display:none}.gallery img{min-width:100%;height:220px;object-fit:contain;background:#f2f1f7;scroll-snap-align:center}.dots{text-align:center;font-size:13px;color:var(--muted);padding:6px}.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:#fff}.stat b{font-size:23px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{background:#fff;color:#555;border:1px solid var(--line);white-space:nowrap}.chatlayout{display:grid;grid-template-columns:320px 1fr;min-height:650px}.chatlist{border-right:1px solid var(--line);padding:10px}.chatitem{padding:12px;border-radius:14px;cursor:pointer}.chatitem:hover,.chatitem.active{background:#f1eeff}.chatwin{display:flex;flex-direction:column;min-height:650px}.chathead{padding:14px;border-bottom:1px solid var(--line)}.messages{flex:1;overflow:auto;padding:18px;background:#f8f7fb}.bubble{max-width:min(78%,560px);padding:10px 12px;border-radius:16px;margin:7px 0;white-space:pre-wrap;line-height:1.35}.left{margin-right:auto;background:#fff;border:1px solid var(--line)}.right{margin-left:auto;background:#ddd4ff}.meta{font-size:10px;color:#777;margin-top:5px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}.composer input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px}.admin{color:#6948ff}.seller{color:#078f62}.verify{color:var(--blue);font-weight:900}.notice{padding:13px;border-radius:14px;background:#f1eeff;margin:9px 0}.danger{color:var(--bad)}.oktxt{color:var(--ok)}.verified-logo{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;background:linear-gradient(145deg,#6d4fff,#9d8cff);color:#fff;font-size:11px;font-weight:900;vertical-align:middle;margin-left:4px;box-shadow:0 3px 10px #7254ff30}.table{width:100%;overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:13px}.modal{position:fixed;inset:0;background:#1118;z-index:50;display:grid;place-items:center;padding:18px}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:18px;box-shadow:0 24px 70px #3b2e7a22;animation:loginPop .28s cubic-bezier(.2,.8,.2,1) both}.authbox button{width:100%;margin-top:5px}.authbox .muted a{color:var(--p);font-weight:800;text-decoration:none}.authbox .muted a:hover{text-decoration:underline}@keyframes loginPop{0%{opacity:0;transform:translateY(18px) scale(.96)}60%{opacity:1;transform:translateY(-3px) scale(1.015)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes floatBlob{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(18px,-14px,0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}@media(max-width:700px){.chatlayout{grid-template-columns:1fr}.chatlist{border-right:0;border-bottom:1px solid var(--line);max-height:260px;overflow:auto}.chatwin{min-height:570px}}

/* Smooth iOS-style transitions — ringan, tapi terasa di setiap pergantian layar */
#app.page-enter{animation:appEnter .46s cubic-bezier(.22,.8,.22,1) both;will-change:opacity,transform,filter}
#page.page-swap{animation:pageSwap .38s cubic-bezier(.22,.8,.22,1) both;will-change:opacity,transform,filter}
#authForm.form-swap{animation:formSwap .38s cubic-bezier(.22,.8,.22,1) both;will-change:opacity,transform,filter}
#auth.fade-out{animation:screenOut .22s ease both}
#app.fade-out{animation:screenOut .22s ease both}
#modal:not(.hidden) .modalbox{animation:modalPop .30s cubic-bezier(.2,.8,.2,1) both}
@keyframes appEnter{0%{opacity:0;transform:translateY(12px) scale(.985);filter:blur(4px)}55%{opacity:1;transform:translateY(-2px) scale(1.002);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes pageSwap{0%{opacity:0;transform:translateY(10px) scale(.992);filter:blur(3px)}60%{opacity:1;transform:translateY(-1px) scale(1.001);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes formSwap{0%{opacity:0;transform:translateX(12px) scale(.985);filter:blur(3px)}60%{opacity:1;transform:translateX(-1px) scale(1.002);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes screenOut{from{opacity:1;transform:none;filter:none}to{opacity:0;transform:translateY(-6px) scale(.99);filter:blur(2px)}}
@keyframes modalPop{0%{opacity:0;transform:translateY(12px) scale(.96);filter:blur(3px)}65%{opacity:1;transform:translateY(-2px) scale(1.01);filter:blur(0)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#app.page-enter,#page.page-swap,#authForm.form-swap,#auth.fade-out,#app.fade-out,#modal:not(.hidden) .modalbox{animation:none!important;filter:none!important}}
</style></head><body>
<div id="auth" class="auth"><div id="authbox" class="card authbox"><div class="auth-brand"><div class="logo auth-logo"><span>V</span></div><h1>VeloraGames</h1><div class="muted">Marketplace akun game</div></div><div id="authForm"></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="topin"><div class="vbrand"><div class="logo"><span>V</span></div><div class="vbrandtext"><b>VeloraGames</b><small>GAME ACCOUNT MARKET</small></div></div><button class="secondary" onclick="logout()">Keluar</button></div><nav id="nav" class="nav"></nav></header><main id="page" class="wrap"></main></div><div id="modal" class="modal hidden"></div>
<script>
const API=localStorage.getItem('vg_api')||'https://velora.dlizztamvan8.workers.dev/api';const QRIS_IMAGE='https://files.catbox.moe/xjce6d.jpg';let token=localStorage.getItem('vg_token')||'',me=null,cfg={},currentChat=null,poll=null;

const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function smoothSwap(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;requestAnimationFrame(()=>el.classList.add(cls))}
function fadeOut(el){if(!el)return Promise.resolve();el.classList.remove('fade-out');void el.offsetWidth;el.classList.add('fade-out');return new Promise(r=>setTimeout(r,220))}
function fadeIn(el){if(!el)return;el.classList.remove('fade-out');void el.offsetWidth;requestAnimationFrame(()=>el.classList.add('page-enter'))}
const pageObserver=new MutationObserver(()=>smoothSwap($('page'),'page-swap'));
const formObserver=new MutationObserver(()=>smoothSwap($('authForm'),'form-swap'));
pageObserver.observe($('page'),{childList:true,subtree:false});
formObserver.observe($('authForm'),{childList:true,subtree:true});
function enterApp(){smoothSwap($('app'),'page-enter')}

async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Gagal');return d}
async function auth(mode='login'){ $('auth').classList.remove('hidden');$('app').classList.add('hidden');$('authbox').classList.remove('login-pop');void $('authbox').offsetWidth;$('authbox').classList.add('login-pop');$('authForm').classList.remove('form-swap');void $('authForm').offsetWidth;$('authForm').innerHTML=mode==='login'?`<h2>Sign In</h2><div class="muted">Use your phone number or email and password.</div><div class="field"><label>Phone / Email</label><input id="ident"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><label class="muted"><input id="remember" type="checkbox" checked> Keep me signed in</label><br><br><button onclick="login()">Sign In</button><p class="muted">Don't have an account? <a href="#" onclick="auth('register')">Sign Up</a></p>`:`<h2>Create Account</h2><div class="muted">Start with a regular VeloraGames account.</div><div class="field"><label>Full Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Phone Number</label><input id="phone"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><button onclick="register()">Create Account</button><p class="muted">Already have an account? <a href="#" onclick="auth('login')">Sign In</a></p>`}
async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({identifier:$('ident').value,password:$('pass').value})});token=d.token;localStorage.setItem('vg_token',token);boot()}catch(e){alert(e.message)}}
async function register(){try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,email:$('email').value,phone:$('phone').value,password:$('pass').value})});token=d.token;localStorage.setItem('vg_token',token);boot()}catch(e){alert(e.message)}}
async function boot(){try{me=(await api('/me')).user;cfg=await api('/config');await fadeOut($('auth'));$('auth').classList.add('hidden');$('app').classList.remove('hidden');enterApp();nav();home();startPoll()}catch(e){localStorage.removeItem('vg_token');token='';auth()}}
function nav(){let a=[['home','Beranda'],['chats','Chat'],['orders','Pesanan'],['seller','Seller'],['profile','Profil']];if(me.is_admin)a.push(['admin','Admin']);$('nav').innerHTML=a.map(x=>`<button id="n-${x[0]}" onclick="${x[0]}()">${x[1]}</button>`).join('')}
function active(k){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('n-'+k)?.classList.add('active')}
function gallery(p){let ph=[];try{ph=JSON.parse(p.photos||'[]')}catch{}if(!ph.length)ph=['data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22400%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23f0eef8%22/%3E%3C/svg%3E'];return `<div class="gallery">${ph.map(x=>`<img src="${x}" onclick="zoom('${x.replace(/'/g,"\\'")}')">`).join('')}</div><div class="dots">${ph.length} foto · geser kiri/kanan · tekan foto untuk layar penuh</div>`}
async function home(){active('home');const d=await api('/products');$('page').innerHTML=`<div class="row"><div><h2>Marketplace</h2><div class="muted">Beli akun dari seller aktif.</div></div><button onclick="seller()">Menu Seller</button></div><br><div class="grid">${d.products.map(p=>`<div class="card product">${gallery(p)}<span class="pill">${esc(p.game)}</span><h3>${esc(p.title)}</h3><div class="muted">Seller: ${esc(p.seller_name)} <span class="verified-logo" title="Listing Velora">V</span></div><div class="price">Rp${Number(p.price).toLocaleString('id-ID')}</div><button onclick="detail('${p.id}')">Lihat & Beli</button></div>`).join('')||'<div class="card">Belum ada akun.</div>'}</div>`}
async function detail(id){const p=(await api('/products')).products.find(x=>x.id===id);if(!p)return;openModal(`<div class="row"><h2>${esc(p.title)}</h2><button class="secondary" onclick="closeModal()">Tutup</button></div>${gallery(p)}<p>${esc(p.description||'Tidak ada deskripsi.')}</p><div class="price">Rp${Number(p.price).toLocaleString('id-ID')}</div><div class="notice">Biaya admin Rp${cfg.adminFee.toLocaleString('id-ID')}<br>Total: <b>Rp${(Number(p.price)+cfg.adminFee).toLocaleString('id-ID')}</b></div><button onclick="buy('${p.id}')">Beli Akun</button>`)}
async function buy(id){try{const method=prompt('Metode pembayaran: QRIS / DANA / GoPay / OVO / Mandiri / BCA / Seabank','QRIS');if(!method)return;if(method.toUpperCase()==='QRIS'){openModal('<h2>QRIS Pembayaran</h2><div class="notice">Scan QRIS berikut untuk pembayaran VeloraGames.</div><div style="text-align:center"><img src="'+QRIS_IMAGE+'" alt="QRIS VeloraGames" style="width:min(420px,100%);border-radius:18px;border:1px solid var(--line)"></div><br><button onclick="closeModal()">Lanjut Setelah Bayar</button>');}const o=await api('/orders',{method:'POST',body:JSON.stringify({productId:id,method})});const proof=prompt('Setelah pembayaran benar-benar dilakukan, masukkan keterangan/bukti pembayaran.','');if(proof===null)return;await api('/orders/'+o.orderId+'/paid',{method:'POST',body:JSON.stringify({method,proof})});alert('Pembayaran masuk antrean verifikasi admin.');closeModal();orders()}catch(e){alert(e.message)}}
async function orders(){active('orders');const d=await api('/orders');$('page').innerHTML=`<h2>Pesanan</h2><div class="grid">${d.orders.map(o=>`<div class="card"><span class="pill">${esc(o.status)}</span><h3>${esc(o.title)}</h3><div class="muted">${o.id}</div><p>Buyer: ${esc(o.buyer_name)}<br>Seller: ${esc(o.seller_name)}<br>Total: <b>Rp${Number(o.total).toLocaleString('id-ID')}</b></p><div class="row"><button class="secondary" onclick="findOrderChat('${o.id}','${o.seller_id}')">Chat</button>${o.buyer_id===me.id&&o.status==='DELIVERED'?`<button class="ok" onclick="completeOrder('${o.id}')">Pesanan Selesai</button>`:''}</div></div>`).join('')||'<div class="card">Belum ada pesanan.</div>'}</div>`}
async function completeOrder(id){try{await api('/orders/'+id+'/complete',{method:'POST'});alert('Pesanan selesai. Saldo seller diproses.');orders()}catch(e){alert(e.message)}}
async function findOrderChat(orderId,sellerId){const d=await api('/chats');const c=d.chats.find(x=>x.order_id===orderId);if(c)openChat(c.id);else{const x=await api('/chats/admin',{method:'POST'});openChat(x.id)}}
async function chats(){active('chats');const d=await api('/chats');$('page').innerHTML=`<div class="card chatlayout"><aside class="chatlist"><h3>Chat</h3><button class="secondary" style="width:100%;margin-bottom:8px" onclick="adminChat()">Chat Admin</button>${d.chats.map(c=>`<div class="chatitem" onclick="openChat('${c.id}')"><div class="row"><b>${c.type==='GROUP'?'Grup Transaksi':c.type==='ADMIN'?'Admin':'Percakapan'}</b>${Number(c.unread)>0?`<span class="pill">${c.unread}</span>`:''}</div><div class="muted">${esc(c.last_body||'Belum ada pesan')}</div></div>`).join('')||'<div class="muted">Belum ada chat.</div>'}</aside><section id="chatwin" class="chatwin"><div class="chathead"><b>Chat VeloraGames</b><div class="muted">Pesan tersimpan di server.</div></div><div class="messages"><div class="muted">Pilih percakapan.</div></div></section></div>`}
async function adminChat(){const x=await api('/chats/admin',{method:'POST'});chats().then(()=>openChat(x.id))}
async function openChat(id){currentChat=id;const d=await api('/chats/'+id);const w=$('chatwin');w.innerHTML=`<div class="chathead"><b>Velora Chat</b><div class="muted">Online/offline ditentukan oleh aktivitas terakhir.</div></div><div id="msgs" class="messages">${d.messages.map(m=>`<div class="bubble ${m.sender_id===me.id?'right':'left'}"><b class="${m.is_admin?'admin':m.seller_status==='ACTIVE'?'seller':''}">${esc(m.name)} ${m.is_admin||m.seller_status==='ACTIVE'?'<span class="verify">✓</span>':''}</b><div>${esc(m.body)}</div><div class="meta">${new Date(m.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} ${m.sender_id===me.id?(m.read_at?'✓✓':'✓'):''}</div></div>`).join('')}</div><div class="composer"><input id="msg" placeholder="Tulis pesan..."><button onclick="sendMsg('${id}')">Kirim</button></div>`;const el=$('msgs');el.scrollTop=el.scrollHeight}
async function sendMsg(id){const x=$('msg').value.trim();if(!x)return;await api('/chats/'+id+'/messages',{method:'POST',body:JSON.stringify({body:x})});openChat(id)}
async function seller(){active('seller');const s=await api('/seller/status'),l=await api('/seller/listings');$('page').innerHTML=`<div class="row"><div><h2>Area Seller</h2><div class="muted">Fitur khusus seller aktif.</div></div><span class="pill">${s.active?'SELLER AKTIF':'BELUM AKTIF'}</span></div><div class="statgrid"><div class="stat"><div class="muted">Status</div><b>${s.active?'Aktif':'Nonaktif'}</b></div><div class="stat"><div class="muted">Masa aktif</div><b>${s.until?new Date(s.until).toLocaleDateString('id-ID'):'-'}</b></div><div class="stat"><div class="muted">Saldo</div><b>Rp${Number(s.balance||0).toLocaleString('id-ID')}</b></div></div><br>${!s.active?`<div class="card"><h3>Aktifkan Seller</h3><p>Bayar <b>Rp${cfg.sellerPrice.toLocaleString('id-ID')} / ${cfg.sellerDays} hari</b>. Setelah admin menyetujui pembayaran, menu seller aktif.</p><div class="notice"><b>Bayar Seller Rp${cfg.sellerPrice.toLocaleString('id-ID')} / ${cfg.sellerDays} hari</b><br>${esc(cfg.qris)}<div style="margin-top:10px;text-align:center"><img src="${QRIS_IMAGE}" alt="QRIS VeloraGames" style="width:min(360px,100%);border-radius:16px;border:1px solid var(--line)"></div></div><div class="field"><label>Metode</label><select id="sm"><option>QRIS</option><option>DANA</option><option>GoPay</option><option>OVO</option><option>Mandiri</option><option>BCA</option><option>Seabank</option></select></div><div class="field"><label>Bukti / referensi</label><textarea id="sp" placeholder="Nomor referensi atau keterangan pembayaran"></textarea></div><button onclick="paySeller()">Saya Sudah Bayar</button></div>`:`<div class="grid"><div class="card"><h3>Posting Akun</h3><p class="muted">Posting gratis dan langsung tampil di marketplace. Tidak perlu menunggu persetujuan admin.</p><button onclick="listingForm()">Tambah Akun</button></div><div class="card"><h3>Tarik Saldo</h3><p>Saldo: <b>Rp${Number(s.balance||0).toLocaleString('id-ID')}</b></p><button onclick="withdrawForm()">Ajukan Penarikan</button></div></div><br><div class="card"><h3>Listing Saya</h3>${l.products.map(p=>`<div class="notice"><b>${esc(p.title)}</b> · ${esc(p.game)} · Rp${Number(p.price).toLocaleString('id-ID')}<br>Status: ${esc(p.status)}</div>`).join('')||'<div class="muted">Belum ada listing.</div>'}</div>`}`}
async function paySeller(){try{await api('/seller/pay',{method:'POST',body:JSON.stringify({method:$('sm').value,proof:$('sp').value})});alert('Pembayaran seller dikirim ke admin.');seller()}catch(e){alert(e.message)}}
function listingForm(){openModal(`<h2>Tambah Akun</h2><div class="notice">${me.is_admin?'Admin dapat langsung mempublikasikan akun.':'Seller aktif dapat langsung mempublikasikan akun tanpa persetujuan admin.'}</div><div class="field"><label>Game</label><input id="lg" placeholder="Free Fire / Roblox / ML / PUBG"></div><div class="field"><label>Judul</label><input id="lt"></div><div class="field"><label>Harga</label><input id="lp" type="number"></div><div class="field"><label>Deskripsi</label><textarea id="ld"></textarea></div><div class="field"><label>Foto URL (satu per baris)</label><textarea id="lph" placeholder="https://.../foto1.jpg"></textarea></div><button onclick="submitListing()">Publikasikan Akun</button> <button class="secondary" onclick="closeModal()">Batal</button>`)}
async function submitListing(){try{const photos=$('lph').value.split('\n').map(x=>x.trim()).filter(Boolean);await api('/seller/listings',{method:'POST',body:JSON.stringify({game:$('lg').value,title:$('lt').value,price:Number($('lp').value),description:$('ld').value,photos})});alert('Akun berhasil dipublikasikan ke marketplace.');closeModal();me.is_admin?admin():seller()}catch(e){alert(e.message)}}
function withdrawForm(){openModal(`<h2>Tarik Saldo</h2><div class="field"><label>Jumlah</label><input id="wa" type="number"></div><div class="field"><label>Metode</label><select id="wm"><option>DANA</option><option>GoPay</option><option>OVO</option><option>Bank Mandiri</option><option>BCA</option><option>Seabank</option></select></div><div class="field"><label>Nomor rekening / akun</label><input id="wd"></div><button onclick="withdraw()">Ajukan</button>`)}
async function withdraw(){try{await api('/withdrawals',{method:'POST',body:JSON.stringify({amount:Number($('wa').value),method:$('wm').value,destination:$('wd').value})});alert('Permintaan penarikan dikirim ke admin.');closeModal();seller()}catch(e){alert(e.message)}}
async function profile(){active('profile');$('page').innerHTML=`<div class="card"><h2>Profil</h2><div class="field"><label>Nama</label><input id="pn" value="${esc(me.name)}"></div><div class="field"><label>Email</label><input value="${esc(me.email||'')}" disabled></div><div class="field"><label>Nomor HP</label><input value="${esc(me.phone||'')}" disabled></div><p class="muted">Status akun: ${me.is_admin?'Admin':me.seller_status==='ACTIVE'?'Seller aktif':'Buyer / pengguna'}</p><button onclick="saveProfile()">Simpan Profil</button></div>`}
async function saveProfile(){await api('/profile',{method:'PUT',body:JSON.stringify({name:$('pn').value,phone:me.phone})});me=(await api('/me')).user;alert('Profil disimpan')}
async function admin(){active('admin');const s=await api('/admin/stats');$('page').innerHTML=`<h2>Admin Center</h2><div class="statgrid"><div class="stat">User<br><b>${s.users}</b></div><div class="stat">Listing aktif<br><b>${s.products}</b></div><div class="stat">Pesanan<br><b>${s.orders}</b></div><div class="stat">Seller pending<br><b>${s.pendingSeller}</b></div><div class="stat">Laporan<br><b>${s.openReports}</b></div></div><div class="tabs"><button onclick="listingForm()">Post Akun Admin</button><button onclick="adminSellers()">Seller</button><button onclick="adminListings()">Listing</button><button onclick="adminOrders()">Transaksi</button><button onclick="adminUsers()">User</button><button onclick="adminWithdrawals()">Penarikan</button><button onclick="adminReports()">Laporan</button><button onclick="adminSettings()">Pengaturan</button></div><div class="card"><h3>Kontrol Admin</h3><p class="muted">Admin bisa post akun langsung. Seller aktif juga bisa post langsung tanpa persetujuan admin. Admin tetap bisa menonaktifkan listing bila ada laporan atau pelanggaran.</p></div>`}
async function adminSellers(){const d=await api('/admin/seller-payments');$('page').innerHTML=`<h2>Pembayaran Seller</h2>${d.payments.map(x=>`<div class="card"><b>${esc(x.name)}</b> · ${esc(x.phone||x.email||'')}<p>Rp${Number(x.amount).toLocaleString('id-ID')} / ${x.days} hari · ${x.status}<br>${esc(x.proof||'-')}</p>${x.status==='PENDING'?`<button class="ok" onclick="decSeller('${x.id}',true)">MASUK</button> <button class="bad" onclick="decSeller('${x.id}',false)">GAGAL</button>`:''}</div>`).join('')||'<div class="card">Kosong.</div>'}`}
async function decSeller(id,ok){await api('/admin/seller-payments/'+id+'/decision',{method:'POST',body:JSON.stringify({ok})});adminSellers()}
async function adminListings(){const d=await api('/admin/products');$('page').innerHTML=`<h2>Moderasi Listing</h2>${d.products.map(x=>`<div class="card"><b>${esc(x.title)}</b><p>${esc(x.game)} · Rp${Number(x.price).toLocaleString('id-ID')} · ${esc(x.seller_name)}<br>Status: ${x.status}</p>${x.status==='PENDING'?`<button class="ok" onclick="decProduct('${x.id}',true)">SETUJUI</button> <button class="bad" onclick="decProduct('${x.id}',false)">TOLAK</button>`:''}</div>`).join('')}`}
async function decProduct(id,ok){await api('/admin/products/'+id+'/decision',{method:'POST',body:JSON.stringify({ok})});adminListings()}
async function adminOrders(){const d=await api('/admin/orders');$('page').innerHTML=`<h2>Transaksi</h2>${d.orders.map(x=>`<div class="card"><b>${esc(x.title)}</b><p>Buyer: ${esc(x.buyer_name)}<br>Seller: ${esc(x.seller_name)}<br>Total: Rp${Number(x.total).toLocaleString('id-ID')}<br>Status: ${x.status}</p><div>${x.status==='VERIFYING'?`<button class="ok" onclick="decOrder('${x.id}','ACCEPT_PAYMENT')">MASUK</button> <button class="bad" onclick="decOrder('${x.id}','REJECT_PAYMENT')">GAGAL</button>`:''}${x.status==='PAID'?`<button onclick="decOrder('${x.id}','MARK_DELIVERED')">TANDAI DIKIRIM</button>`:''}</div></div>`).join('')}`}
async function decOrder(id,action){await api('/admin/orders/'+id+'/decision',{method:'POST',body:JSON.stringify({action})});adminOrders()}
async function adminUsers(){const d=await api('/admin/users');$('page').innerHTML=`<h2>Manajemen User</h2><div class="table"><table><tr><th>Nama</th><th>Kontak</th><th>Status</th><th>Saldo</th></tr>${d.users.map(x=>`<tr><td>${esc(x.name)} ${x.is_admin?'<span class="verify">✓ Admin</span>':''}</td><td>${esc(x.phone||x.email||'')}</td><td>${x.seller_status==='ACTIVE'?'Seller Aktif':'User'}</td><td>Rp${Number(x.balance||0).toLocaleString('id-ID')}</td></tr>`).join('')}</table></div>`}
async function adminWithdrawals(){const d=await api('/admin/withdrawals');$('page').innerHTML=`<h2>Penarikan Seller</h2>${d.withdrawals.map(x=>`<div class="card"><b>${esc(x.name)}</b><p>Rp${Number(x.amount).toLocaleString('id-ID')} · ${esc(x.method)} · ${esc(x.destination)}<br>Status: ${x.status}</p>${x.status==='PENDING'?`<button class="ok" onclick="decWd('${x.id}',true)">BAYAR</button> <button class="bad" onclick="decWd('${x.id}',false)">TOLAK</button>`:''}</div>`).join('')||'<div class="card">Kosong.</div>'}`}
async function decWd(id,ok){await api('/admin/withdrawals/'+id+'/decision',{method:'POST',body:JSON.stringify({ok})});adminWithdrawals()}
async function adminReports(){const d=await api('/admin/reports');$('page').innerHTML=`<h2>Laporan</h2>${d.reports.map(x=>`<div class="card"><b>${esc(x.target_type)} ${esc(x.target_id)}</b><p>${esc(x.reason)}<br>${esc(x.details||'')}</p>${x.status==='OPEN'?`<button onclick="resolveReport('${x.id}')">SELESAIKAN</button>`:''}</div>`).join('')||'<div class="card">Tidak ada laporan.</div>'}`}
async function resolveReport(id){await api('/admin/reports/'+id+'/resolve',{method:'POST'});adminReports()}
async function adminSettings(){$('page').innerHTML=`<h2>Pengaturan Admin</h2><div class="card"><div class="field"><label>QRIS / instruksi pembayaran</label><textarea id="aq">${esc(cfg.qris)}</textarea></div><div class="field"><label>Biaya admin buyer</label><input id="af" type="number" value="${cfg.adminFee}"></div><div class="field"><label>Harga seller</label><input id="sf" type="number" value="${cfg.sellerPrice}"></div><div class="field"><label>Masa seller (hari)</label><input id="sd" type="number" value="${cfg.sellerDays}"></div><button onclick="saveSettings()">Simpan</button></div>`}
async function saveSettings(){await api('/admin/settings',{method:'PUT',body:JSON.stringify({qris_text:$('aq').value,admin_fee:$('af').value,seller_price:$('sf').value,seller_days:$('sd').value})});cfg=await api('/config');alert('Pengaturan disimpan')}
function openModal(html){$('modal').innerHTML=`<div class="modalbox">${html}</div>`;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function zoom(src){openModal(`<button class="secondary" onclick="closeModal()">Tutup</button><img src="${src}" style="width:100%;max-height:80vh;object-fit:contain;margin-top:10px">`)}
async function logout(){try{await api('/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('vg_token');token='';if(poll)clearInterval(poll);await fadeOut($('app'));$('app').classList.add('hidden');auth()}
function startPoll(){if(poll)clearInterval(poll);poll=setInterval(async()=>{if(currentChat){try{openChat(currentChat)}catch{}}},2500)}
auth();if(token)boot();
</script></body></html>
